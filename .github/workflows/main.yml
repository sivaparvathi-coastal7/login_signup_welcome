name: Playwright Tests (Final Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    container:
      image: mcr.microsoft.com/playwright:v1.40.0-jammy
    
    # 🔑 Pass the Secrets
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        echo "⬇️ Installing System Tools..."
        apt-get update && apt-get install -y python3-pip git

        echo "⬇️ Installing Python Libraries..."
        python3 -m pip install --upgrade pip
        
        # ✅ FIXED: Added 'python-dotenv' here
        python3 -m pip install playwright pytest pytest-playwright fastapi httpx groq python-dotenv
        
        echo "⬇️ Installing Browsers..."
        python3 -m playwright install --with-deps chromium

    - name: Create Output Directory
      run: mkdir -p scripts

    - name: Generate Test Script
      run: python3 generate_script.py

    - name: Run Universal Tests
      id: run-tests
      run: python3 scripts/test_universal_autogenerated.py --headless

    # ==========================================================
    # 🚨 TRIAGE SECTION
    # ==========================================================
    
    - name: Checkout Triage Repo
      if: failure()
      uses: actions/checkout@v4
      with:
        # ✅ Ensure this is "OwnerName/RepoName" 
        repository: Aswinikamireddy
        token: ${{ secrets.TRIAGE_PAT }}
        path: triage-folder

    - name: Push Failure Report
      if: failure()
      run: |
        echo "🚨 Processing Failure..."
        
        # Verify folder exists
        if [ ! -d "triage-folder" ]; then
          echo "❌ Error: Triage folder missing. Check the repository name."
          exit 1
        fi

        # Check/Create Report
        if [ -f "artifacts/report.html" ]; then
          echo "📄 Report found."
        else
          mkdir -p artifacts
          echo "Critical Failure in Run ${{ github.run_id }}" > artifacts/report.html
        fi

        # Move to triage folder
        cd triage-folder
        cp ../artifacts/report.html ./failure_report_${{ github.run_id }}.html
        
        # Git Configuration
        git config user.name "Auto-Triage Bot"
        git config user.email "bot@github.com"
        
        # Stage and Commit
        git add .
        git commit -m "🚨 Test Failed: Run ${{ github.run_id }}"
        
        # ✅ FIXED: Explicitly set upstream to master to fix the push error
        git push --set-upstream origin master
