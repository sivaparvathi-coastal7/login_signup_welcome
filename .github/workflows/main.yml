name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Check formatting with black
        run: black --check .

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Added pytest-xdist for future parallel execution
          pip install pytest pytest-playwright pytest-json-report requests
      
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          # Added --output to ensure screenshots go to a predictable folder
          pytest --verbose --json-report --json-report-file=test-report.json --output=test-results --screenshot=only-on-failure --video=retain-on-failure
      
      - name: Parse and send failed tests to Jira
        if: steps.pytest.outcome == 'failure'
        run: |
          python - <<'EOF'
          import json
          import requests
          import os
          import sys
          from pathlib import Path
          
          if not os.path.exists('test-report.json'):
              print("::error::Test report file missing!")
              sys.exit(1)
          
          with open('test-report.json', 'r') as f:
              report = json.load(f)
          
          failed_tests = [t for t in report.get('tests', []) if t.get('outcome') == 'failed']
          
          jira_url = os.environ['JIRA_URL']
          jira_email = os.environ['JIRA_EMAIL']
          jira_token = os.environ['JIRA_API_TOKEN']
          jira_project = os.environ['JIRA_PROJECT_KEY']
          
          headers = {'Content-Type': 'application/json'}
          auth = (jira_email, jira_token)
          
          def check_existing_issue(test_name):
              # Check if a bug is already open (status != Done)
              jql = f'project={jira_project} AND summary~"{test_name}" AND labels="automated-test-failure" AND status != Done'
              try:
                  res = requests.get(f"{jira_url}/rest/api/2/search", headers=headers, auth=auth, params={'jql': jql})
                  return res.status_code == 200 and res.json().get('total', 0) > 0
              except Exception:
                  return False
          
          for test in failed_tests:
              test_name = test.get('nodeid', 'Unknown')
              
              if check_existing_issue(test_name):
                  print(f"⊘ Skipping duplicate: {test_name}")
                  continue
              
              # Robust screenshot finding - Playwright creates complex folder names
              clean_name = test_name.split("::")[-1] # Get just function name
              screenshot_file = None
              
              # Look for png files in test-results that match the test name
              found_files = list(Path('test-results').rglob(f"*{clean_name}*/*.png"))
              if found_files:
                  screenshot_file = found_files[0] # Take the first match
              
              issue_data = {
                  "fields": {
                      "project": {"key": jira_project},
                      "summary": f"Test Failure: {test_name}",
                      "description": f"Failed: {test_name}\n\nError:\n{test.get('call', {}).get('longrepr', 'No details')[:2000]}",
                      "issuetype": {"name": "Bug"},
                      "labels": ["automated-test-failure"]
                  }
              }
              
              resp = requests.post(f"{jira_url}/rest/api/2/issue", headers=headers, auth=auth, json=issue_data)
              
              if resp.status_code == 201:
                  key = resp.json()['key']
                  print(f"✓ Created {key}")
                  
                  # Upload screenshot if found and exists
                  if screenshot_file and screenshot_file.exists():
                      files = {'file': (screenshot_file.name, open(screenshot_file, 'rb'), 'image/png')}
                      at_headers = {'X-Atlassian-Token': 'no-check'}
                      requests.post(f"{jira_url}/rest/api/2/issue/{key}/attachments", headers=at_headers, auth=auth, files=files)
                      print(f"  ✓ Attached screenshot")
              else:
                  print(f"✗ Failed: {resp.text}")
          EOF
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: playwright-results
          path: |
            test-report.json
            test-results/
          retention-days: 7
      
      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      # Customize this section based on your deployment target
      # Example: Deploy to AWS, Heroku, Docker, etc.
      
      - name: Deploy to production
        run: |
          echo "Add your deployment commands here"
          # Example for Docker:
          # docker build -t myapp:latest .
          # docker push myapp:latest
          
          # Example for AWS:
          # aws s3 sync ./dist s3://my-bucket/
          
          # Example for Heroku:
          # git push heroku main
        env:
          # Add your deployment secrets here
          # DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          pass
